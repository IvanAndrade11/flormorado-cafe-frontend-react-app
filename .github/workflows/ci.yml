name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El token de Actions solo necesita leer el código: los despliegues usan sus
# propios secretos, así que un paso comprometido no puede escribir en el repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run prettier:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
